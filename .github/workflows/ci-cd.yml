name: CI/CD

# Único camino a producción: vercel.json desactiva el deploy por Git y el job `deploy` dispara el
# Deploy Hook de Vercel solo cuando pasan quality y e2e. Detalle en docs/09-deploy/DEPLOY-PLAN.md.
# Trigger `pull_request` (nunca `pull_request_target`): los PRs de forks no reciben secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build, esquema y unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar esquema Prisma
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      - name: Tests unitarios (franjas, semáforo, validación de pedidos)
        run: npm run test:unit
      - name: Build de producción
        run: npm run build
        env:
          # Placeholders: el build no se conecta a la DB.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      - name: Auditoría de dependencias (informativa)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  e2e:
    name: Playwright E2E
    # Los PRs de forks no tienen acceso a secrets: no corren E2E.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: e2e
    # Los E2E escriben pedidos en la rama Neon de desarrollo: nunca dos corridas a la vez.
    concurrency:
      group: e2e-neon-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar migraciones a la rama de desarrollo
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.E2E_DATABASE_URL_UNPOOLED }}
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Correr Playwright
        run: npm run test:e2e
        env:
          # Rama Neon de DESARROLLO (secrets del Environment `e2e`), nunca producción.
          # ADMIN_PASSWORD/ADMIN_SESSION_SECRET: defaults de CI en playwright.config.js.
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.E2E_DATABASE_URL_UNPOOLED }}
      - name: Subir reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy a producción (Deploy Hook)
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Vercel construye el commit más reciente de `main` con las variables de Production que ya
      # tiene configuradas; CI no ve ningún secret de la app. La URL del hook es un secret.
      - name: Disparar el Deploy Hook de Vercel
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "Falta el secret VERCEL_DEPLOY_HOOK_URL"; exit 1; }
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke post-deploy
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      statuses: read
    steps:
      # El hook responde enseguida (PENDING) y Vercel construye después: se espera el estado
      # `Vercel` de ESTE commit para no verificar por error el deployment anterior.
      - name: Esperar el deployment de este commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            s=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '[.statuses[] | select(.context | test("Vercel"))] | first | .state // "none"')
            echo "[$i] estado Vercel: $s"
            case "$s" in
              success) exit 0 ;;
              failure|error) echo "El deployment de Vercel falló"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Tiempo agotado esperando el deployment"; exit 1

      - name: Chequeos de solo lectura
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ]; then echo "Falta la variable PRODUCTION_URL"; exit 1; fi
          BASE_URL="${BASE_URL%/}"
          code() { curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$@"; }
          check() { [ "$2" = "$3" ] && echo "OK   $1 -> $2" || { echo "FAIL $1 -> $2 (esperado $3)"; exit 1; }; }

          check "GET /" "$(code "$BASE_URL/")" 200
          check "GET /comprar" "$(code "$BASE_URL/comprar")" 200

          curl -sf --retry 5 --retry-delay 5 "$BASE_URL/api/orders/slots" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("slots"), list)'
          echo "OK   GET /api/orders/slots -> JSON válido con slots"

          # Admin cerrado sin cookie: redirige a login y la API responde 401 (nada de datos de clientes).
          check "GET /admin sin sesión" "$(code "$BASE_URL/admin")" 307
          check "GET /api/admin/orders sin sesión" "$(code "$BASE_URL/api/admin/orders")" 401
